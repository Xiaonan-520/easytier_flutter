name: Release (Android, split ABI)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    name: EasyTier core (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4

      # The Kotlin binding (EasyTierJNI.kt) is copied verbatim from upstream
      # and must match the .so — keep this pin in sync with docs/integration.md.
      - name: Checkout EasyTier upstream @ ff3921c
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          ref: ff3921ce6842f9660d629eafac499498026c6784
          path: easytier-upstream

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: easytier-upstream
          prefix-key: easytier-core
          key: ${{ matrix.target }}

      # Upstream pins its toolchain via rust-toolchain.toml; the target must
      # be added to THAT toolchain, not to stable.
      - name: Add rust target to pinned toolchain
        working-directory: easytier-upstream
        run: |
          TC=$(rustup show active-toolchain | awk '{print $1}')
          echo "pinned: $TC"
          rustup target add ${{ matrix.target }} --toolchain "$TC"

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Install cargo-ndk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          cargo install cargo-ndk --locked

      - name: Build libeasytier_android_jni.so (${{ matrix.abi }})
        working-directory: easytier-upstream/easytier-contrib/easytier-android-jni
        run: cargo ndk -t ${{ matrix.target }} build --release

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: jni-${{ matrix.abi }}
          path: easytier-upstream/target/${{ matrix.target }}/release/libeasytier_android_jni.so

  apk:
    name: Flutter APKs
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Fetch native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: jni-*
          merge-multiple: true
          path: android/app/src/main/jniLibs

      - name: Verify ABI coverage
        run: |
          find android/app/src/main/jniLibs -name "*.so" | sort
          test -f android/app/src/main/jniLibs/arm64-v8a/libeasytier_android_jni.so
          test -f android/app/src/main/jniLibs/armeabi-v7a/libeasytier_android_jni.so
          test -f android/app/src/main/jniLibs/x86_64/libeasytier_android_jni.so

      - name: Build split APKs
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  dist/easytier-flutter-v0.2.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/easytier-flutter-v0.2.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk     dist/easytier-flutter-v0.2.0-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk            dist/easytier-flutter-v0.2.0-universal.apk
          ls -l dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
